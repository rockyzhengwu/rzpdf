[package]
name = "pdf"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license.workspace = true

[features]
prepare-diagnostics = []

[dependencies]
allocator-api2 = "0.2.21"
hashbrown = { version = "0.16.1", default-features = false, features = ["allocator-api2"] }
aes = { version = "0.8.4", features = ["zeroize"] }
bitstream-io = "4.10.0"
cbc = "0.1.2"
fax = "0.2.7"
flate2 = "1.1.9"
hayro-ccitt = { version = "=0.4.0", default-features = false }
hayro-jpeg2000 = { version = "=0.4.1", default-features = false, features = ["std"] }
hayro-jbig2 = { version = "=0.3.1", default-features = false, features = ["std"] }
moxcms = { version = "=0.9.1", default-features = false, features = ["lut"] }
freetype-rs = "0.38.0"
lazy_static = "1.5.0"
md-5 = "0.10.6"
mozjpeg = "0.10.13"
quick-xml = "0.41.0"
thiserror = "2.0.18"
xml-builder = "0.5.4"
font_data = {path="../font-data/"}
encoding_rs = "0.8.35"
png = "0.18.1"
sha2 = { version = "0.10.9", features = ["oid"] }
getrandom = "0.4.3"
zeroize = "1.9.0"
subtle = "2.6.1"
stringprep = "0.1.5"
cms = "0.2.3"
der = { version = "0.7.10", features = ["alloc", "std"] }
ring = "0.17.14"
# Legacy R4 password authentication only; new output remains R6 AES-256.
rc4 = { version = "=0.1.0", features = ["zeroize"] }

[target.'cfg(target_os = "emscripten")'.dependencies]
# Cross compilation must never resolve the host's system FreeType via pkg-config.
freetype-rs = { version = "0.38.0", features = ["bundled"] }

[build-dependencies]
cc = "=1.2.56"
