<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>rzpdf 浏览器预览</title>
<style>
body{font:16px system-ui;margin:2rem;background:#f4f5f7;color:#18202b}main{max-width:1200px;margin:auto}header,.toolbar{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}input[type=number]{width:5rem}output{display:block;margin:1rem 0}button{cursor:pointer}aside{width:200px;flex:none;overflow:auto;max-height:75vh}aside button{display:block;margin-bottom:.5rem;text-align:left}.reader{display:flex;gap:1rem}#viewport{overflow:auto;max-height:80vh;flex:1;min-width:0;padding:8px}#page-content{position:absolute;left:0;top:0;transform-origin:0 0}#page-view{overflow:hidden;position:relative;background:white;box-shadow:0 2px 16px #0002}#canvas{position:absolute;display:block;background:white}#text-layer,#links,#highlights{position:absolute;inset:0;width:100%;height:100%}#text-layer{overflow:hidden;line-height:1;user-select:text}#text-layer span{position:absolute;left:0;top:0;font:1px/1 sans-serif;white-space:pre;color:transparent;transform-origin:0 0}#text-layer span::selection{background:#6ca5ff80}#links{pointer-events:none}#links a{position:absolute;pointer-events:auto}#links a:hover,#links a:focus{outline:2px solid #387fe8;background:#387fe822}#highlights{pointer-events:none}#highlights polygon{fill:#ffce3680}#results{display:flex;gap:.3rem;flex-wrap:wrap}@media(max-width:700px){body{margin:.5rem}.reader{display:block}aside{width:auto;max-height:140px}}
.editor-row{display:flex;flex-direction:column;gap:.3rem;margin:.7rem 0}.editor-row input,.editor-row select,.editor-row textarea{max-width:100%;box-sizing:border-box}.editor-row small{overflow-wrap:anywhere}
#widgets{position:absolute;inset:0;overflow:hidden;pointer-events:none}#widgets input,#widgets select,#widgets textarea{position:absolute;box-sizing:border-box;transform-origin:0 0;pointer-events:auto;margin:0;border:1px solid transparent;padding:1px;background:transparent;color:transparent;font:12px sans-serif}#widgets input[type=checkbox],#widgets input[type=radio]{opacity:.02}#widgets input:focus,#widgets select:focus,#widgets textarea:focus{background:white;color:black;outline:1px solid #387fe8;opacity:1}#widgets input:disabled,#widgets select:disabled,#widgets textarea:disabled{pointer-events:none}
#widgets[data-drawing=true] input,#widgets[data-drawing=true] select,#widgets[data-drawing=true] textarea{pointer-events:none}
</style>
<main><h1>rzpdf 浏览器预览</h1><p>文件仅在本地浏览器处理，最多 8 MiB。</p>
<header><label>PDF <input id="pdf" type="file" accept="application/pdf" disabled></label><label>解析模式 <select id="mode"><option value="strict">严格</option><option value="compatible">兼容</option></select></label><label>密码 <input id="password" type="password" autocomplete="off"></label><button id="unlock" hidden>使用密码打开</button></header>
<p class="toolbar"><label>页码 <input id="page" type="number" value="1" min="1"></label><label>缩放 % <input id="zoom" type="number" value="100" min="10" max="400"></label><label>显示模式 <select id="fit"><option value="manual">手动缩放</option><option value="width">适合页宽</option><option value="page">适合整页</option></select></label><label>视图旋转 <select id="view-rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><button id="render" disabled>显示</button><button id="cancel" disabled>取消任务</button><button id="reopen" disabled>重新打开</button></p>
<form id="search" class="toolbar"><label>搜索 <input id="query" type="search" maxlength="1024" required></label><button id="find" disabled>查找全文</button></form><div id="results" aria-label="搜索结果"></div>
<p><label>替代字体（TTF/OTF/TTC，最多 32 MiB）<input id="font" type="file" accept=".ttf,.otf,.ttc" disabled></label></p>
<section id="font-resources" aria-label="按需字体资源"></section>
<output id="status" role="status">正在加载引擎…</output><div class="reader"><aside><h2>书签</h2><nav id="outline" aria-label="文档书签"></nav><section id="editor" aria-label="文档编辑"></section></aside><div id="viewport"><div id="page-view"><div id="page-content"><canvas id="canvas" width="1" height="1"></canvas><div id="text-layer" aria-label="页面文字"></div><svg id="highlights" aria-hidden="true"></svg><div id="links" aria-label="页面链接"></div><div id="widgets" aria-label="页面表单"></div></div></div></div></div>
</main><script type="module" src="./dist/demo.js"></script></html>
