[package]
name = "render"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
skia-safe = "=0.93.1"
pdf = {path="../pdf/"}

[target.'cfg(target_os = "macos")'.dependencies]
# The native bridge uses the matching public Skia headers and opaque pointer type.
skia-bindings = { version = "=0.93.1", default-features = false }

[build-dependencies]
cc = "=1.2.56"

[dev-dependencies]
libc = "=0.2.182"
serde_json = "=1.0.149"
moxcms = { version = "=0.9.1", default-features = false, features = ["lut"] }

